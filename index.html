function modal(title, fields, okLabel, danger) {

        var n = document.createElement('div'); n.className = 'msg warn'; n.style.fontSize = '13px';
        n.innerHTML = '↺ استرجعتُ ما كتبته سابقاً ولم يُحفظ. <a href="#" id="drx">ابدأ من جديد</a>';
        mb.insertBefore(n, mb.firstChild);
        n.querySelector('#drx').onclick = function (ev) { ev.preventDefault(); var iv = JSON.parse(ini); ids.forEach(function (id) { var e = $('mf_' + id); if (e) e.value = iv[id]; }); drDel(sig); if (n.parentNode) n.parentNode.removeChild(n); };
      }
    }
    var tm = null;
    function save() { clearTimeout(tm); tm = setTimeout(function () { var v = snap(); if (JSON.stringify(v) === ini) drDel(sig); else drSet(sig, ini, v); }, 350); }
    ov.addEventListener('input', save); ov.addEventListener('change', save);
    var mf = ov.querySelector('.mf'); if (mf) { var sp = document.createElement('small'); sp.className = 'muted'; sp.style.marginInlineEnd = 'auto'; sp.textContent = '💾 يُحفظ ما تكتبه تلقائياً'; mf.insertBefore(sp, mf.firstChild); }
    var cx = $('mcx'); if (cx) cx.addEventListener('click', function () { clearTimeout(tm); drDel(sig); });
    var ok = $('mok'); if (ok) ok.addEventListener('click', function () {
      clearTimeout(tm); var at = Date.now();
      setTimeout(function () { if (LASTERR < at) drDel(sig); }, 4000); /* إن ظهر خطأ بعد الحفظ تبقى المسودة */
    }, true);
  }
  var md0 = modal;
  modal = function (title, fields, okLabel, danger) {
    var before = document.querySelectorAll('.ov').length, p = md0(title, fields, okLabel, danger);
    try { attach(title, fields || [], before); } catch (e) { }
    return p;
  };
})();

if (S.token) start(false); else showLogin();

  function upd() { if (pend > 0) { if (!tm) tm = setTimeout(function () { tm = null; if (pend > 0) box().className = 'on'; }, 160); } else { if (tm) { clearTimeout(tm); tm = null; } if (el) el.className = ''; } }
  var o = rpc;
  rpc = function (a, p) { pend++; upd(); var r; try { r = o(a, p); } catch (e) { pend--; upd(); throw e; } r.then(function () { pend = Math.max(0, pend - 1); upd(); }, function () { pend = Math.max(0, pend - 1); upd(); }); return r; };
})();
